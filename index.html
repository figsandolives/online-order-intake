<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173f32">
  <title>متابعة طلبات الأونلاين | مخبز التين والزيتون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261013-redesign-v1">
  <link rel="stylesheet" href="print.css?v=20261013-invoice-v3">
</head>
<body data-catalog="bakery">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://figsolives.online/">
        <img src="logo.png" alt="">
        <span><b id="trackerBrand">مخبز التين والزيتون</b><small>متابعة طلبات الأونلاين</small></span>
      </a>
      <nav class="catalog-switch" aria-label="اختيار القسم">
        <button type="button" data-catalog="bakery" aria-pressed="true">المخبز <b id="bakeryNewCount" class="hidden">0</b></button>
        <button type="button" data-catalog="restaurant" aria-pressed="false">المطعم <b id="restaurantNewCount" class="hidden">0</b></button>
      </nav>
      <div class="topbar-tools">
        <span class="live-status" id="liveStatus"><i></i><span id="liveStatusText">جارٍ التحميل…</span></span>
        <button class="bell-button" id="enableSoundButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span id="soundButtonText">تفعيل الجرس</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <div class="toolbar">
      <div class="status-tabs" role="tablist" aria-label="حالة الطلبات">
        <button class="tab" role="tab" data-tab="accepted">المقبولة <b id="acceptedCount">0</b></button>
        <button class="tab active" role="tab" data-tab="new">طلبات جديدة <b id="newCount">0</b></button>
      </div>
      <label class="page-size">عرض
        <select id="pageSize"><option value="12">12</option><option value="24">24</option><option value="48">48</option><option value="96">96</option></select>
      </label>
    </div>

    <section class="orders-grid" id="ordersList" aria-live="polite"></section>

    <footer class="pagination" id="pagination">
      <button type="button" id="previousPage">السابق</button>
      <span id="pageInfo">1 / 1</span>
      <button type="button" id="nextPage">التالي</button>
    </footer>
  </main>

  <dialog id="orderDialog"><article class="dialog-card"><button class="close" id="closeDialog" aria-label="إغلاق">×</button><div id="orderDetails"></div></article></dialog>
  <audio id="newOrderSound" src="doordash.mp3" preload="auto"></audio>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js?v=20261013-invoice-v3"></script>
</body>
</html>
